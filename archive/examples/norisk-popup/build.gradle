plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url = uri('https://maven.fabricmc.net/')
    }

    maven {
        url = uri('https://maven.norisk.gg/repository/maven-releases/')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.x ist unobfuscated (Mojang official mappings / keine Mapping-Umwandlung nötig)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // NoRisk Client & Bibliotheken zur Compile-Zeit verlinkt (zur Laufzeit optional)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

